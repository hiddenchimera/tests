<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7MNC1PLLZ7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7MNC1PLLZ7');
    gtag('config', 'G-FW7R85YTVX');

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペルソナ16タイプ他己分析｜回答ページ - Chimera Test Lab</title>
  <meta name="description" content="友達や仲間の性格・普段の印象を12問で回答する他己分析ページ。">

  <!-- 既存共通CSS ＆ 専用CSS -->
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="quiz-card">
      <div id="test-nav-header"></div>

      <!-- ① 開始前画面：関係性と回答者名入力 -->
      <div id="answer-intro-view">
        <span class="intro-badge">OTHER-ANALYSIS</span>
        <h1 class="intro-title"><span id="target-name-display" style="color: #4f46e5;"></span> さんの他己分析</h1>
        <p class="intro-desc">
          あなたが普段接している <strong id="target-name-bold"></strong> さんの印象について、直感で12問の質問に答えてください（所要時間：約1分）。
        </p>

        <div class="input-group">
          <label class="input-label">あなたと相手の関係性は？</label>
          <div class="relation-grid">
            <button type="button" class="rel-select-btn active" data-rel="friend">友達</button>
            <button type="button" class="rel-select-btn" data-rel="partner">恋人</button>
            <button type="button" class="rel-select-btn" data-rel="work">職場・学校</button>
            <button type="button" class="rel-select-btn" data-rel="family">家族</button>
            <button type="button" class="rel-select-btn" data-rel="hobby">ネット・趣味</button>
            <button type="button" class="rel-select-btn" data-rel="other">その他</button>
          </div>
        </div>

        <div class="input-group" style="margin-top: 16px;">
          <label for="respondent-name-input" class="input-label">あなたの名前（ニックネーム）</label>
          <input type="text" id="respondent-name-input" class="text-input" placeholder="例: たろう（空欄でもOK）" maxlength="12">
        </div>

        <button id="start-survey-btn" class="start-btn-primary" style="margin-top: 10px;">診断をはじめる</button>
      </div>

      <!-- ② 設問回答画面 -->
      <div id="answer-survey-view" style="display: none;">
        <div class="progress-wrap">
          <div class="progress-bar-bg">
            <div id="survey-progress-bar" class="progress-bar-fill"></div>
          </div>
          <span id="survey-progress-text" class="progress-text">1 / 12</span>
        </div>

        <div class="question-box">
          <p id="survey-question-text" class="question-text">質問文が読み込まれます</p>
        </div>

        <div class="likert-scale">
          <button class="likert-btn" data-score="1">
            <span class="likert-num">1</span>
            <span class="likert-txt">全く当てはまらない</span>
          </button>
          <button class="likert-btn" data-score="2">
            <span class="likert-num">2</span>
            <span class="likert-txt">あまり当てはまらない</span>
          </button>
          <button class="likert-btn" data-score="3">
            <span class="likert-num">3</span>
            <span class="likert-txt">どちらともいえない</span>
          </button>
          <button class="likert-btn" data-score="4">
            <span class="likert-num">4</span>
            <span class="likert-txt">やや当てはまる</span>
          </button>
          <button class="likert-btn" data-score="5">
            <span class="likert-num">5</span>
            <span class="likert-txt">非常に当てはまる</span>
          </button>
        </div>
      </div>

      <!-- ③ 回答完了画面：結果を相手に送る -->
      <div id="answer-finish-view" style="display: none;">
        <span class="intro-badge">COMPLETE</span>
        <h1 class="intro-title">回答が完了しました！</h1>
        <p class="intro-desc">
          ご協力ありがとうございました。<br>
          以下のボタンを押して、回答結果を <strong id="finish-target-name"></strong> さんに送り返してください。相手の画面で結果が集計されます。
        </p>

        <div style="display: flex; flex-direction: column; gap: 12px; margin: 24px 0;">
          <a id="line-share-btn" href="#" target="_blank" rel="noopener noreferrer" class="start-btn-primary" style="background: #06c755; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
            LINEで結果を送る
          </a>
          <button id="copy-result-btn" class="copy-btn" style="padding: 12px; font-size: 0.95rem;">結果リンクをコピー（DM等で送信）</button>
        </div>

        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; font-size: 0.8rem; color: #64748b; line-height: 1.5; text-align: left;">
          ※ あなたがどの設問にどう答えたかという個別内容は相手には伝わりません（4つの性格傾向バランスのみ反映されます）。
        </div>
      </div>

      <footer class="tool-footer">
        <p class="disclaimer">※本ツールは非公式の性格分析ツールです。</p>
        <div class="nav-links-row" style="margin-top: 14px;">
          <a href="../../" class="main-link">← テスト一覧トップへ</a>
        </div>
      </footer>
    </section>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="answer.js"></script>
</body>
</html>
