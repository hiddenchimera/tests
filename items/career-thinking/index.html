  <!-- OGP基本設定 -->

</head>
<body>
  <main class="container">
    <section id="quiz-card">
      <!-- 共通JSが左上に「← トップへ」ボタンを自動生成 -->
      <div id="test-nav-header"></div>

      <!-- ① 診断の説明（イントロ）画面 -->
      <div id="intro-view">
        <span class="intro-badge">CAREER</span>
        <h1 class="intro-title">適職・思考特性診断</h1>
        <p class="intro-desc">
          「論理・設計」「直感・発想」「現場・推進」「共感・支援」。<br>
          仕事や問題解決の場で無意識にとっているアプローチから、あなたの資質に合った環境と適職タイプを特定します。
        </p>

        <div class="intro-meta-box">
          <div class="intro-meta-item">
            <span class="meta-label">設問数</span>
            <span class="meta-val">全 10 問</span>
          </div>
          <div class="intro-meta-item">
            <span class="meta-label">目安時間</span>
            <span class="meta-val">約 3 分</span>
          </div>
        </div>

        <button id="start-btn" class="start-btn-primary">診断をはじめる</button>
      </div>

      <!-- ② 診断の設問画面（初期状態は非表示） -->
      <div id="quiz-view" style="display: none;">
        <div class="card-header">
          <p id="progress" class="progress-text">質問 1 / 10</p>
          <h1 id="question-text" class="question-text">読み込み中…</h1>
        </div>
        <div id="options-container" class="options-group">
          <!-- script.jsが動的に生成 -->
        </div>
      </div>
    </section>
